<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 1: JavaScript Registration Form Validation</title>
  <style>
    /* Clean, beginner-friendly college practical styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f7f9fa;
      color: #333333;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: 20px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      border: 1px solid #e1e4e8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    header {
      margin-bottom: 25px;
      border-bottom: 2px solid #eaecef;
      padding-bottom: 15px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      background-color: #eef2ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 22px;
      color: #1f2937;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 14px;
      color: #6b7280;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .required {
      color: #dc2626;
    }

    input[type="text"],
    input[type="number"],
    input[type="email"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input:focus,
    textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 6px;
    }

    .radio-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
      cursor: pointer;
    }

    .error-msg {
      display: block;
      font-size: 12px;
      color: #dc2626;
      margin-top: 4px;
      min-height: 16px;
      font-weight: 500;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .btn-submit {
      background-color: #4f46e5;
      color: #ffffff;
    }

    .btn-submit:hover {
      background-color: #4338ca;
    }

    .btn-reset {
      background-color: #f3f4f6;
      color: #374151;
      border-color: #d1d5db;
    }

    .btn-reset:hover {
      background-color: #e5e7eb;
    }

    /* Success box that displays when form is completely valid */
    .success-card {
      display: none;
      margin-top: 25px;
      padding: 18px;
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 6px;
      color: #065f46;
    }

    .success-card h2 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #047857;
    }

    .success-card ul {
      margin-left: 20px;
      font-size: 14px;
    }

    .success-card li {
      margin-bottom: 4px;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <span class="badge">Assignment 3 — Practical 1</span>
      <h1>Student Registration Form</h1>
      <p class="subtitle">Demonstrating JavaScript Form Validation, Functions, Conditions, DOM Manipulation, and Events.</p>
    </header>

    <!-- Registration Form (novalidate stops browser default popups so our JS runs) -->
    <form id="registrationForm" novalidate>

      <!-- 1. Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" placeholder="e.g. John Doe">
        <span class="error-msg" id="nameError"></span>
      </div>

      <!-- 2. Age -->
      <div class="form-group">
        <label for="age">Age <span class="required">*</span></label>
        <input type="number" id="age" placeholder="e.g. 21">
        <span class="error-msg" id="ageError"></span>
      </div>

      <!-- 3. Email -->
      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" placeholder="e.g. student@example.com">
        <span class="error-msg" id="emailError"></span>
      </div>

      <!-- 4. Phone -->
      <div class="form-group">
        <label for="phone">Phone Number (10 digits) <span class="required">*</span></label>
        <input type="text" id="phone" placeholder="e.g. 9876543210" maxlength="10">
        <span class="error-msg" id="phoneError"></span>
      </div>

      <!-- 5. Address -->
      <div class="form-group">
        <label for="address">Residential Address <span class="required">*</span></label>
        <textarea id="address" placeholder="Enter complete address (min 10 characters)"></textarea>
        <span class="error-msg" id="addressError"></span>
      </div>

      <!-- 6. Password -->
      <div class="form-group">
        <label for="password">Password (min 8 characters) <span class="required">*</span></label>
        <input type="password" id="password" placeholder="At least 8 characters">
        <span class="error-msg" id="passwordError"></span>
      </div>

      <!-- 7. Gender -->
      <div class="form-group">
        <label>Gender <span class="required">*</span></label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="gender" value="Male"> Male
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="Female"> Female
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="Other"> Other
          </label>
        </div>
        <span class="error-msg" id="genderError"></span>
      </div>

      <!-- Submit & Reset Buttons -->
      <div class="button-group">
        <button type="submit" class="btn-submit">Register</button>
        <button type="reset" class="btn-reset">Reset</button>
      </div>

    </form>

    <!-- Success Message Box -->
    <div id="successCard" class="success-card">
      <h2>✓ Registration Successful!</h2>
      <p style="margin-bottom: 8px;">Here is the verified data received:</p>
      <ul id="summaryList">
        <!-- Filled dynamically by JavaScript -->
      </ul>
    </div>

    <footer>
      Web Application Frameworks Lab · Assignment 3 · Practical 1
    </footer>
  </div>

  <script>
    // =========================================================================
    // JAVASCRIPT VALIDATION LOGIC
    // =========================================================================

    // 1. Select the form and success elements using DOM methods
    const form = document.getElementById("registrationForm");
    const successCard = document.getElementById("successCard");
    const summaryList = document.getElementById("summaryList");

    // 2. Helper function to show error message beside a field
    function setError(elementId, message) {
      const errorSpan = document.getElementById(elementId);
      if (errorSpan) {
        errorSpan.textContent = message;
      }
    }

    // 3. Helper function to clear all error messages
    function clearAllErrors() {
      const errorSpans = document.querySelectorAll(".error-msg");
      errorSpans.forEach(function (span) {
        span.textContent = "";
      });
    }

    // 4. Attach submit event listener to the form
    form.addEventListener("submit", function (event) {
      // Prevent browser's default action (page reload / HTTP POST)
      event.preventDefault();

      // Reset previous error messages and hide success card
      clearAllErrors();
      successCard.style.display = "none";

      // Track whether the form is completely valid
      let isValid = true;

      // --- Read Values from Input Fields ---
      const fullName = document.getElementById("fullName").value.trim();
      const ageValue = document.getElementById("age").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      const password = document.getElementById("password").value;
      const genderRadio = document.querySelector('input[name="gender"]:checked');

      // --- Check 1: Full Name (not empty, at least 3 characters) ---
      if (fullName === "") {
        setError("nameError", "Full Name is required.");
        isValid = false;
      } else if (fullName.length < 3) {
        setError("nameError", "Name must be at least 3 characters long.");
        isValid = false;
      }

      // --- Check 2: Age (number between 18 and 100) ---
      const ageNumber = Number(ageValue);
      if (ageValue === "") {
        setError("ageError", "Age is required.");
        isValid = false;
      } else if (isNaN(ageNumber) || ageNumber < 18 || ageNumber > 100) {
        setError("ageError", "Please enter a valid age between 18 and 100.");
        isValid = false;
      }

      // --- Check 3: Email (basic pattern with @ and .) ---
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (email === "") {
        setError("emailError", "Email Address is required.");
        isValid = false;
      } else if (!emailPattern.test(email)) {
        setError("emailError", "Please enter a valid email (e.g. user@domain.com).");
        isValid = false;
      }

      // --- Check 4: Phone (exactly 10 digits) ---
      const phonePattern = /^\d{10}$/;
      if (phone === "") {
        setError("phoneError", "Phone number is required.");
        isValid = false;
      } else if (!phonePattern.test(phone)) {
        setError("phoneError", "Phone number must be exactly 10 digits.");
        isValid = false;
      }

      // --- Check 5: Address (minimum 10 characters) ---
      if (address === "") {
        setError("addressError", "Address is required.");
        isValid = false;
      } else if (address.length < 10) {
        setError("addressError", "Address must be at least 10 characters long.");
        isValid = false;
      }

      // --- Check 6: Password (minimum 8 characters) ---
      if (password === "") {
        setError("passwordError", "Password is required.");
        isValid = false;
      } else if (password.length < 8) {
        setError("passwordError", "Password must be at least 8 characters long.");
        isValid = false;
      }

      // --- Check 7: Gender (at least one option must be selected) ---
      if (!genderRadio) {
        setError("genderError", "Please select your gender.");
        isValid = false;
      }

      // --- Final Decision ---
      if (isValid) {
        // Build summary content using DOM manipulation
        summaryList.innerHTML = `
          <li><strong>Name:</strong> ${escapeHtml(fullName)}</li>
          <li><strong>Age:</strong> ${ageNumber}</li>
          <li><strong>Email:</strong> ${escapeHtml(email)}</li>
          <li><strong>Phone:</strong> ${escapeHtml(phone)}</li>
          <li><strong>Gender:</strong> ${genderRadio.value}</li>
          <li><strong>Address:</strong> ${escapeHtml(address)}</li>
        `;
        // Make the success box visible
        successCard.style.display = "block";
      }
    });

    // 5. Reset button event listener
    form.addEventListener("reset", function () {
      clearAllErrors();
      successCard.style.display = "none";
    });

    // 6. Security helper: escapes special HTML characters to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
