<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="50%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="streamGrad1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="streamGrad2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="180" y1="0" x2="180" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="420" y1="0" x2="420" y2="360" />
    <line x1="540" y1="0" x2="540" y2="360" />
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
  </g>

  <!-- Interconnecting Synaptic Curves -->
  <path d="M 80,180 C 180,60 220,120 300,180 S 420,280 520,180" stroke="url(#streamGrad1)" stroke-width="3" fill="none" />
  <path d="M 80,120 C 200,240 260,80 380,140 S 480,240 520,120" stroke="url(#streamGrad2)" stroke-width="2" fill="none" />
  <path d="M 120,280 C 220,160 340,320 440,200 S 500,80 540,100" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

  <!-- Neural Layers & Compute Nodes -->
  <!-- Layer 1 -->
  <circle cx="80" cy="120" r="7" fill="#38bdf8" filter="url(#nodeGlow)" />
  <circle cx="80" cy="180" r="9" fill="#6366f1" filter="url(#nodeGlow)" />
  <circle cx="80" cy="240" r="7" fill="#a855f7" filter="url(#nodeGlow)" />

  <!-- Layer 2 -->
  <circle cx="190" cy="90" r="8" fill="#a855f7" filter="url(#nodeGlow)" />
  <circle cx="190" cy="160" r="10" fill="#38bdf8" filter="url(#nodeGlow)" />
  <circle cx="190" cy="230" r="6" fill="#6366f1" filter="url(#nodeGlow)" />
  <circle cx="190" cy="290" r="7" fill="#38bdf8" filter="url(#nodeGlow)" />

  <!-- Central Transformer Core / Reasoning Engine -->
  <rect x="260" y="115" width="80" height="130" rx="12" fill="#0b1329" stroke="#6366f1" stroke-width="2" />
  <rect x="272" y="130" width="56" height="6" rx="3" fill="#38bdf8" />
  <rect x="272" y="145" width="40" height="6" rx="3" fill="#818cf8" />
  <rect x="272" y="160" width="48" height="6" rx="3" fill="#c084fc" />
  <circle cx="300" cy="205" r="14" fill="#6366f1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" filter="url(#nodeGlow)" />
  <polygon points="300,196 307,209 293,209" fill="#38bdf8" />

  <!-- Layer 4 -->
  <circle cx="410" cy="80" r="7" fill="#818cf8" filter="url(#nodeGlow)" />
  <circle cx="410" cy="150" r="10" fill="#c084fc" filter="url(#nodeGlow)" />
  <circle cx="410" cy="220" r="9" fill="#38bdf8" filter="url(#nodeGlow)" />
  <circle cx="410" cy="280" r="6" fill="#818cf8" filter="url(#nodeGlow)" />

  <!-- Layer 5 (Output / Capabilities) -->
  <circle cx="520" cy="120" r="8" fill="#38bdf8" filter="url(#nodeGlow)" />
  <circle cx="520" cy="180" r="11" fill="#6366f1" filter="url(#nodeGlow)" />
  <circle cx="520" cy="240" r="8" fill="#c084fc" filter="url(#nodeGlow)" />

  <!-- Data Flow Packets / Tokens -->
  <circle cx="135" cy="150" r="3" fill="#ffffff" />
  <circle cx="230" cy="130" r="3" fill="#ffffff" />
  <circle cx="370" cy="165" r="3" fill="#ffffff" />
  <circle cx="470" cy="200" r="3" fill="#ffffff" />

  <!-- Badges inside illustration -->
  <g transform="translate(420, 290)">
    <rect width="150" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" />
    <circle cx="16" cy="18" r="5" fill="#10b981" />
    <text x="30" y="22" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">FRONTIER COGNITION</text>
  </g>
  <g transform="translate(30, 30)">
    <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" />
    <text x="14" y="21" fill="#38bdf8" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">⚡ 1M+ CONTEXT STREAM</text>
  </g>
</svg>
